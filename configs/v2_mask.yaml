# V2: RGB + target/destination mask image (control). Identical to v1 except `model`.
name: v2_mask
tasks: [T1, T2, T3, T4, T5, T6, T7]

data:
  repo_id: local/gvla_libero
  manifest: groundedvla/data/split_manifest.json

model:
  variant: v2
  image_keys: [observation.images.image, observation.images.image2, observation.images.mask]
  use_grounding: false
  freeze_vision_encoder: true
  train_expert_only: true
  chunk_size: 50

train:
  seed: 0
  steps: 20000
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-10
  warmup_steps: 1000
  scheduler: cosine
  precision: bf16
  checkpoint_every: 2000
  log_every: 100
  val_every: 1000
  val_batches: 25             # x batch_size frames of the val demos (5 per task)
  num_workers: 8
  select_from_steps: [10000, 15000, 20000]

eval:
  mode: naive                  # naive | temporal_ensemble (compared in B1, then fixed)
  execution_horizon: 10
  te_m: 0.01
  rollouts_per_task: 50
  seed: 2000

logging:
  wandb_project: groundedvla
